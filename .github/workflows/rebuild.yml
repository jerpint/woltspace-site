name: rebuild

# Shared wolts and apps are read from their seed repos when the site builds.
# This rebuilds once a day so new ones show up without a merge here. The
# "Run workflow" button on the Actions tab does the same on demand.
# Needs the repo secret VERCEL_DEPLOY_HOOK (Vercel: Settings > Git > Deploy Hooks, branch main).

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Vercel to rebuild
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK is not set; nothing to do."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" -o /dev/null
          echo "Rebuild requested."
